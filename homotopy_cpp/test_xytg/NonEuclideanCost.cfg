
-BEGIN_FILE-
/* To view this file properly set Tab Size to 4 characters */

===============================================
/* Parameters and Global Variables */
RandomizeVals:		FALSE

discretization:	100 100	10				// 44 47 50 // X Y T discretization - units: number of cells
cellsize:       1.0       1.0			// X,Y T cell sizes - units: meters, seconds

ViolationCostPower:		1.0				// The exponential weight of constraint violation cost over trajectory cost
HuristicType:			2				// 1: sqrt(Dx^2+Dy^2); 2: sqrt(2)*min(DX,DY)+abs(DX-DY) [Only for 8-connected grids]
PrecomputeHeuristic:	1				// 1 or 0
CollisionCheckRadius:	0				// Defines the radius of inter-robot collision (presently only 0 and 1 are only allowed values)
IsIterationSymmetric:	FALSE			// Whether all the robots modify their trajectories in each iteration

DoJointStatespeceLogging:	TRUE		// Whether to log 6D obstacle points - parameters follow below
							2  5		// [Method, The radius of the ball that to include as obstacle in joint statespace]
										// Method- 0: 2-ND matching while planning for all robots;
										//         1: 2N-D matching while planning for only violating robots;
										//         2: 2V-D matching while planning for only violating robots (V=no. of violating robots)


IterationType:	2				// 1-FixedCount ; 2-AutoDetectConvergence
				100  10  5		// Max, Min Number of iterations; for AutoDetectConvergence, number of unchanged cycles before which to stop
MaxSuperIter:	3

RestartUponHomotopyJump:	TRUE
HomotopyClassMethod:		1		// 1: If robot R made a jump at the end of superiteration i,
									//    block the homotopy class for R in superiteration i+1. Unblock all other

-----------------------------------------------
/* Description of individual Robots */

BEGIN_ROBOT:	0					// The index of the robot
	start:		50.0  3.0	0.0			// X Y T start coordinate - units: meters, meters, seconds
	end:		50.0  	 97.0		0.0		// X Y T end coordinate - units: meters, meters, seconds
	BlockedHomotopyClass: -8.412437 8.412437
	connectivity:	0	3			// time_level and patch_size of connectivity matrix that follows
		1 1 1 
		1 1 1 
		1 1 1 
END_ROBOT


-----------------------------------------------
/* Description of individual Constraints */

PenaltyWeightIncrementMethod:	2				// 1-FixedIncrement ; 2-AutoIncrement
								1   5.0		// If AutoIncrement: Max number of steps in binary search, search threshold


LeftBaseWeight:   0.01

-----------------------------------------------
/* Description of Static Obstacles */

BEGIN_STATIC_OBSTACLE:	0				// Inflation radius (in number of cells); Possible types - 'Circle', 'Rectangle', 'Map'

Rectangle: 35.0 15.0  45.0 85.0 
Rectangle: 25.0 30.0  35.0 70.0
Rectangle: 20.0 45.0  25.0 55.0

Rectangle: 60.0 25.0  70.0 75.0

HomotopyCriticalPt: 35.0 50.0
HomotopyCriticalPt: 65.0 50.0

END_STATIC_OBSTACLE

BEGIN_DYNAMIC_OBSTACLE: 0
END_DYNAMIC_OBSTACLE

UseHomotopyClass:      TRUE					// Works only when all robots use 8-connected grids
HomotopyExplore:   -1                       // -1 to disable


===============================================

-END_FILE-
