
-BEGIN_FILE-
/* To view this file properly set Tab Size to 4 characters */

===============================================
/* Parameters and Global Variables */
RandomizeVals:		FALSE

discretization:	50 50	  90				// 44 47 50 // X Y T discretization - units: number of cells
cellsize:		0.04 		0.4			// X,Y T cell sizes - units: meters, seconds

ViolationCostPower:		1.0				// The exponential weight of constraint violation cost over trajectory cost
HuristicType:			2				// 1: sqrt(Dx^2+Dy^2); 2: sqrt(2)*min(DX,DY)+abs(DX-DY) [Only for 8-connected grids]
PrecomputeHeuristic:	1				// 1 or 0
CollisionCheckRadius:	0				// Defines the radius of inter-robot collision (presently only 0 and 1 are only allowed values)
IsIterationSymmetric:	FALSE			// Whether all the robots modify their trajectories in each iteration

DoJointStatespeceLogging:	TRUE		// Whether to log 6D obstacle points - parameters follow below
							2  5		// [Method, The radius of the ball that to include as obstacle in joint statespace]
										// Method- 0: 2-ND matching while planning for all robots; 1: 2N-D matching while planning for only violating robots
										//		   2: 2V-D matching while planning for only violating robots (V=no. of violating robots)

IterationType:	2				// 1-FixedCount ; 2-AutoDetectConvergence
				500  5  100		// Max, Min Number of iterations; for AutoDetectConvergence, number of unchanged cycles before which to stop
MaxSuperIter:	10

-----------------------------------------------
/* Description of individual Robots */

BEGIN_ROBOT:	0					// The index of the robot
	start:		0.5  0.2	0.0			// X Y T start coordinate - units: meters, meters, seconds
	task:		0.1  0.5
	task:		0.9  0.5
	end:		0.5  1.8	35.0		//2.5 5.2	2.0  //7.2 2.5	40.0			// X Y T end coordinate - units: meters, meters, seconds
	connectivity:	1	3			// time_level and patch_size of connectivity matrix that follows
		1 1 1 
		1 1 1 
		1 1 1 
END_ROBOT

BEGIN_ROBOT:	1					// The index of the robot
	start:		1.5 0.2	0.0		// X Y T start coordinate - units: meters, meters, seconds
	task:		1.9  1.5
	task:		1.1  1.5
	end:		1.5 1.8	   35.0		//2.5 10.2	2.0   //8.8 10.0	40.0	// X Y T end coordinate - units: meters, meters, seconds
	connectivity:	1	3			// time_level and patch_size of connectivity matrix that follows
		1 1 1 
		1 1 1 
		1 1 1 
END_ROBOT

-----------------------------------------------
/* Description of individual Constraints */

PenaltyWeightIncrementMethod:	2				// 1-FixedIncrement ; 2-AutoIncrement
								1   5.0		// If AutoIncrement: Max number of steps in binary search, search threshold

BEGIN_CONSTRAINT:		0	1					// The indices of the robots between which the constraint is being defined
	penaltyweightparams:	0.0   10.0  0.04 0.01	// <AutoIncrement>: START MAX MINSEARCHINCREMENT MININCREMENT [Set MAX -ve for Inf]
	constraintprofile:							// Possible types - 'Range', 'Point', //'PiecewiseLinear', 'Spline'
		Range:	0.0  35.0     -1.0					// Range: T_start T_end D - units: seconds, seconds, meters - negative D implies infinity
		Point:	17.5 	0.08						// Point: T D - units: seconds, meters - negative D implies infinity
END_CONSTRAINT


-----------------------------------------------
/* Description of Static Obstacles */

BEGIN_STATIC_OBSTACLE:					// Possible types - 'Circle', //'Polygon'
	Circle:	1.0  1.0	0.2
END_STATIC_OBSTACLE

===============================================

-END_FILE-










































