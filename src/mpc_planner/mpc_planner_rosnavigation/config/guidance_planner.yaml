guidance_planner:
  debug:
    output: false
    visuals: true

  T: 4.0 # Time horizon [s]
  N: 20  # Discrete time steps [#]
  seed: 1 # Seed of the visibility-PRM. -1 = random

  homotopy:
    n_paths: 4 # Number of guidance trajectories
    comparison_function: Homology # Homology (default) Winding or UVD
    winding:
      pass_threshold: 0.87 #1.74 # half of pi
      use_non_passing: true
    use_learning: false
    track_selected_homology_only: false

  predictions_are_constant_velocity: true

  dynamics:
    connections: Straight # Straight (default) or Dubins
    turning_radius: 0.305 # [m]

  sampling:
    n_samples: 50 # Max number of samples for PRM
    timeout: 10 # Timeout for PRM sampling [ms]
    margin: 0.0 # [m] sampled outside of goals 

  max_velocity: 3.0 #7.0 # Maximum velocity of connections between nodes
  max_acceleration: 3.0 #7.0 # Maximum velocity of connections between nodes
  connection_filters:
    forward: true
    velocity: false
    acceleration: false
  selection_weights: # Weights on the spline selection heuristic cost
    length: 5.
    velocity: 0.
    acceleration: 1.
    consistency: 0.75 # 0 = consistent, 1 = inconsistent

  goals: # Only used when `LoadReferencePath` is used to set the goals
    longitudinal: 5 # Number of goals in direction of the path
    vertical: 5 # Number of goals in direction orthogonal to the path

  spline_optimization: # Settings when the splines are optimized and used as reference trajectory
    enable: true
    num_points: 10  # -1 = N
    geometric: 25.
    smoothness: 10.
    collision: 0.5
    velocity_tracking: 0.01

  visuals:
    transparency: 0.5 # The least transparent the obstacle visualization is (0-1)
    visualize_all_samples: true # Visualizes all PRM samples
    visualize_homology: false
    show_indices: false

  enable:
    dynamically_propagate_nodes: true  # Propagate the nodes in time (dropping them)
    project_from_obstacles: false # Project the guidance trajectory from obstacles if enabled (not necessary by default)

  test_node:
    continuous_replanning: false         # When using the test nodes: keep planning continuously?

  step_map:
    resolution_ratio: 1.0   # costmap 해상도 대비 배수
    size_scale: 0.5         # costmap 크기 배율
    forward_offset_ratio: 0.5  # 진행 방향 중심 오프셋 비율
    max_alpha: 1.0          # RViz alpha 최대값 (cost=1일 때)
    z_scale: 0.2            # RViz z 축 스케일
    publish: true           # STEP 맵 표시 여부
    topic: guidance_planner/step_map
    frame_id: map
    gaussian_samples: 1000         # 가우시안 샘플 수
    gaussian_sample_value: 0.05     # 샘플당 코스트 누적 값
    occupancy_threshold: 0.5       # 코스트가 이 값 이상이면 점유로 판단
    dynamic_method: gaussian_independent  # gaussian_independent / gaussian_trajectory / (deterministic: 자동)
    propagate_uncertainty: true          # gaussian_independent에서 불확실성 누적 전파 여부
    stage_z_offset: 0.0                  # stage 간 추가 z 오프셋 [m] (0.0 = 오프셋 없음)
    vis_stages: 5                        # 0=전체, N>0 → start/terminal 포함 N개 스테이지만 시각화
    inflate_dynamic: true                # Gaussian 샘플 후 box filter inflation 적용 여부
