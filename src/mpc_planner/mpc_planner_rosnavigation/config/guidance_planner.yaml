guidance_planner:
  algorithm: STRRT  # PRM (기본) | AStar | HybridAStar | STRRT | RiskAwareSTRRT

  astar:
    num_headings: 16    # 헤딩 이산화 bin 수 (22.5°/bin)
    w_max:  0.8         # 최대 각속도 [rad/s]
    w_time: 1.0         # 시간 비용 가중치
    w_occ:  5.0         # StepMap 점유 확률 비용 가중치
    w_accel: 0.2        # |dv| 가속도 비용 가중치 [per m/s]
    w_yaw:  0.5         # |dθ| 요레이트 비용 가중치 [per rad]

  hybrid_astar:
    num_heading_bins: 16  # closed-set 헤딩 이산화 bin 수 (22.5°/bin)
    speed_bins: 2         # closed-set 속도 이산화 bin 수
    n_v_samples: 2        # 속도 모션 프리미티브 수
    n_w_samples: 5        # 각속도 모션 프리미티브 수
    n_substeps: 3         # 유니사이클 적분 서브스텝 수
    w_max: 1.5            # 최대 각속도 [rad/s]
    a_max: 8.0            # 최대 가속도 [m/s²]
    goal_tol_xy: 0.5      # 목표 도달 허용 거리 [m]
    time_budget_ms: 45.0  # 20Hz(50ms) 보장용 탐색 시간 예산 [ms]
    w_time: 1.0
    w_occ: 5.0
    w_accel: 0.2
    w_yaw: 0.5
    w_yaw_rate: 0.1

  st_rrt:
    max_iter:        1000    # 반복 횟수 (20Hz → 50ms 예산)
    steer_dt_min:    0.2     # edge 최소 시간 [s]
    steer_dt_max:    1.5     # edge 최대 시간 [s]
    neighbor_radius: 2.0     # choose-parent / rewire 반경 [m]
    match_tol:       0.4     # steer endpoint 매칭 허용 오차 [m]
    goal_radius:     0.5     # goal 도달 판정 반경 [m]
    goal_bias:       0.30    # goal 방향 샘플링 확률
    w_time:          1.0     # 도착 시각 비용 가중치
    w_ctrl:          0.05    # control effort 비용 가중치
    check_dt:        0.05    # edge 충돌 검사 시간 간격 [s]
    path_lat_half_width: 3.0 # reference path 횡방향 ±폭 [m] (균일 샘플링)
    greedy_goal_connect: true # RRT-Connect식 반복 extend로 goal 직접 연결 (false=기존 동작)
    corridor:
      w_base:        0.8     # 튜브 기본 반폭 [m]
      p_explore:     0.15    # 전역 exploration 샘플 비율 (corridor 밖 우회·완전성)
      dt_win_minus:  0.3     # corridor 시각 창 과거측 [s]
      dt_win_plus:   0.8     # corridor 시각 창 미래측 [s] (감속 여유로 더 넓게)
      w_risk:        1.5     # risk 적응형 튜브 폭 게인 [m] (W = w_base + w_risk·p, p=점유확률)
      w_max:         3.0     # 튜브 반폭 상한 [m]
    risk:
      w_risk:        2.0     # edge risk 적분(∫φ·dl) 비용 가중치
      tau_soft:      0.2     # 점유확률 p < tau_soft 는 risk 적분에서 무시 (가우시안 꼬리)
      v_min_ratio:   0.2     # 감속 바닥 v_min = v_min_ratio·v_max (로봇 freeze 방지)
      beta:          1.5     # 감속 곡률 g(p)=(1-p)^β (클수록 위험 시 급감속)

  ra_strrt:
    max_iter:                       2000
    k_rrtstar:                      10
    max_step_cells:                 3        # steer max step [cells]
    initial_goal_count:             10
    max_goal_count:                 50
    max_nodes:                      4000
    cold_start_min_remaining_nodes: 50

    v_max:                          3.0      # [m/s] — must match StepMap layer timing
    v_preferred:                    2.0      # [m/s]
    w_max:                          2.0      # [rad/s]

    risk:
      tau_hard:                     0.7      # cellCost >= tau_hard → blocked
      tau_soft:                     0.2      # cellCost < tau_soft → ignored in risk integral

    cost:
      w_time:                       1.0      # baseline
      w_risk:                       2.0      # 위험 회피 강도
      w_progress:                   0.5      # reference path 진행 보상
      w_curvature:                  0.3      # 곡률 패널티
      w_goal_progress:              1.0      # solution 단계 진행 보너스
      lambda_nn:                    0.5      # NN distance 공간/시간 균형

    goal:
      tube_width:                   1.0      # reference path 주변 tube 반경 [m]
      s_min_offset:                 0.5      # current projection 으로부터 최소 진행 [m]
      t_min:                        1.0      # 너무 빠른 도달 배제 [s]
      t_max:                        4.0      # = Config::T

    time_budget_ms:                 90.0
    enable_warm_start:              true

  debug:
    output: false
    visuals: true

  T: 4.0 # Time horizon [s]
  N: 20  # Discrete time steps [#]
  seed: 1 # Seed of the visibility-PRM. -1 = random

  homotopy:
    n_paths: 4 # Number of guidance trajectories
    comparison_function: UVD # Homology (default) Winding or UVD
    winding:
      pass_threshold: 0.87 #1.74 # half of pi
      use_non_passing: true
    uvd:
      samples: -1 # Longitudinal samples for UVD. <= 0 => derive from StepMap resolution (anti-tunneling)
    use_learning: false
    track_selected_homology_only: false

  predictions_are_constant_velocity: true

  # Build the PRM graph purely from the StepMap occupied cells, ignoring raw
  # dynamic/static obstacle data (collision, visibility and goal filtering).
  step_map_only: true

  dynamics:
    connections: Straight # Straight (default) or Dubins
    turning_radius: 0.305 # [m]

  sampling:
    n_samples: 50 # Max number of samples for PRM
    timeout: 10 # Timeout for PRM sampling [ms]
    margin: 0.0 # [m] sampled outside of goals
    velocity_aware: true # Restrict samples to the space-time set reachable from the start at max_velocity

  max_velocity: 3.0 #7.0 # Maximum velocity of connections between nodes
  max_acceleration: 3.0 #7.0 # Maximum velocity of connections between nodes
  connection_filters:
    forward: true
    velocity: true
    acceleration: false
  selection_weights: # Weights on the spline selection heuristic cost
    length: 5.
    velocity: 0.
    acceleration: 1.
    consistency: 0.75 # 0 = consistent, 1 = inconsistent

  goals: # Only used when `LoadReferencePath` is used to set the goals
    longitudinal: 5 # Number of goals in direction of the path
    vertical: 5 # Number of goals in direction orthogonal to the path

  spline_optimization: # Settings when the splines are optimized and used as reference trajectory
    enable: true
    num_points: 10  # -1 = N
    geometric: 25.
    smoothness: 10.
    collision: 0.5
    velocity_tracking: 0.01

  visuals:
    transparency: 0.5 # The least transparent the obstacle visualization is (0-1)
    visualize_all_samples: true # Visualizes all PRM samples
    visualize_homology: false
    show_indices: false

  enable:
    dynamically_propagate_nodes: true  # Propagate the nodes in time (dropping them)
    project_from_obstacles: false # Project the guidance trajectory from obstacles if enabled (not necessary by default)

  test_node:
    continuous_replanning: false         # When using the test nodes: keep planning continuously?

  gym:
    run_once: false            # true면 StepMap + guidance 계획을 1회만 실행 (이후 시각화/TF만 유지)
    plot_step_map: true       # run_once 완료 시 StepMap layer 분포를 matplotlib로 시각화
    plot_show: false           # 그래프 창 표시 (false면 PNG만 저장)
    plot_output_dir: ""       # CSV/PNG 저장 경로 (빈 문자열이면 guidance_planner 패키지 경로)
                              # 시각화 layer 개수는 step_map/vis_stages 를 따름

  step_map:
    resolution_ratio: 1.0   # costmap 해상도 대비 배수
    size_scale: 0.5         # costmap 크기 배율
    forward_offset_ratio: 0.5  # 진행 방향 중심 오프셋 비율
    max_alpha: 0.1          # RViz alpha 최대값 (cost=1일 때)
    z_scale: 0.2            # RViz z 축 스케일
    publish: true           # STEP 맵 표시 여부
    topic: guidance_planner/step_map
    frame_id: map
    gaussian_samples: 1000         # 가우시안 샘플 수
    gaussian_sample_value: 0.001     # 샘플당 코스트 누적 값 (1000 × 0.001 = 1.0 총 확률 질량)
    occupancy_threshold: 0.9       # 코스트가 이 값 이상이면 점유로 판단
    dynamic_method: gaussian_independent  # gaussian_independent / gaussian_trajectory / (deterministic: 자동)
    propagate_uncertainty: true          # gaussian_independent에서 불확실성 누적 전파 여부
    stage_z_offset: 0.0                  # stage 간 추가 z 오프셋 [m] (0.0 = 오프셋 없음)
    vis_stages: 5                        # 0=전체, N>0 → start/terminal 포함 N개 스테이지만 시각화
    visualize_occupied_only: true       # true이면 occupancy_threshold 이상으로 점유된 셀만 시각화
    inflate_dynamic: circle_sum          # "none" / "box" / "circle_max" / "circle_sum"
    inflate_include_obstacle_radius: true  # true이면 동적 장애물 radius를 로봇 반경에 더해 inflation
    color_gamma: 1.0                      # 시각화 gamma 보정 (1.0=선형, <1이면 낮은 cost 차이 강조)
