# Nav2 full-stack config for Phase 2 / Option A
# (docs/nav2_full_plugin_migration_plan.md). controller_server loads the
# MPCController plugin from this package; planner_server keeps the NavfnPlanner
# from the existing Phase 1 bring-up.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: false
      width: 60
      height: 60
      origin_x: -5.0
      origin_y: -5.0
      resolution: 0.1
      robot_radius: 0.325
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /front/scan
          sensor_frame: front_laser
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.5
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Generous failure_tolerance: the MPC plugin can take a few seconds of
    # intermittent QP failures (§7-1 grid-path issue) before recovering. The
    # Nav2 default of 0.3s aborts the action before the MPC ever stabilises,
    # which lets the scenario_orchestrator's 800ms relaunch chain into a
    # tight Begin-navigating -> Aborting feedback loop.
    failure_tolerance: 30.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 0.1 m / 30 s -- the MPC sometimes inches forward during QP failures.
      # Don't abort early; the orchestrator's own 60s timeout handles a
      # truly stuck robot.
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 2.0 m tolerance per user request: snapping the goal earlier prevents
      # the MPC from spinning in place around the goal point when grid-path
      # QP failures (§7-1) leave it unable to settle on the last few cm.
      # yaw is generously relaxed (~180 deg) so heading mismatch alone never
      # blocks the goal-reached signal.
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 3.14
      stateful: True
    FollowPath:
      plugin: "local_planner/MPCController"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      robot_radius: 0.325
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /front/scan
          sensor_frame: front_laser
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.5
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
